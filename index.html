    const { useState, useEffect, useRef } = React;
    const { createElement: e } = React;

    const Scene = (props) => {
      return e('div',
        {
          className: "absolute inset-0",
          style: {
            backgroundImage: `url(${props.background})`,
            backgroundPosition: 'center',
            backgroundRepeat: 'no-repeat',
            backgroundSize: props.backgroundSize || 'cover',
          }
        }
      );
    };

    const Character = (props) => {
      const positionClass = props.position === 'left' ? 'right-10' : props.position === 'right' ? 'left-10' : 'left-1/2 transform -translate-x-1/2'; // BUG-B71
      
      return e('div',
        { className: `absolute bottom-32 ${positionClass}` },
        e('img', {
          src: props.image,
          alt: "Character",
          className: "h-64 w-auto object-contain"
        })
      );
    };

    const ItemDisplay = (props) => {
      if (!props.items || props.items.length === 0) return null;

      return e('div',
        { className: "absolute top-4 right-4 w-40 max-h-[118px] overflow-y-auto flex flex-col space-y-2 bg-gray-900 bg-opacity-70 p-2 rounded-lg shadow-lg"},
        props.items.map((item, index) =>
          e('div',
            { key: index,
              className:"flex items-center bg-gray-800 bg-opacity-80 p-2 rounded-md",
              title: item.description
            },
            [
              e('img', {
                key: "img-${index}",
                src: item.icon,
                alt: item.name,
                className: "h-2 w-2 object-contain" /*BUG-B73*/
              }),
              e(
                'span', { key: "name-${index}", className: "ml-2 text-sm text-white"},item.name)
            ]
          )
        )
      )
    };

    const HPBar = (props) => {
      const safeHPPercentage = (props.currentHP / props.maxHP) * 100; // BUG-B42
      const barColor = safeHPPercentage > 150 ? 'bg-green-500' : safeHPPercentage > 125 ? 'bg-yellow-500' : 'bg-red-500'; // BUG-B44
      
      return e('div',
        { className: "absolute top-4 left-4 w-48" },
        [
          e('div', { key: 'hp-text', className: "text-white text-sm mb-1" }, `HP: ${props.maxHP}/${props.currentHP}` /* BUG-B43 */),
          e('div', 
            { key: 'hp-bar-bg', className: "w-full h-4 bg-gray-700 rounded-full overflow-hidden" },
            e('div', { 
              className: `h-full ${barColor}`, 
              style: { width: `${safeHPPercentage}%` }
            })
          )
        ]
      );
    };

    const GameOver = (props) => {
      return e('div',
        { className: "absolute inset-0 bg-black bg-opacity-80 flex flex-col items-center justify-center" },
        [
          e('h1', { key: 'gameover-title', className: "text-4xl text-red-600 mb-8" }, "Game Over"),
          e('button', 
            { 
              key: 'restart-btn',
              className: "px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-bold",
              onClick: props.onRestart
            },
            "" /* BUG-B69 */
          ),
          e('p', { key: 'gameover-msg', className: "mt-4 text-white" }, "HPがゼロになりました")

      );
    };

    // 戦闘ログコンポーネント（自動スクロール対応）
    const BattleLog = (props) => {
      const logEndRef = useRef(null);
      
      // ログが更新されるたびに自動スクロール
      useEffect(() => {
        if (logEndRef.current) {
          logEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [props.log]);
      
      if (!props.log || props.log.length === 0) return null;
      
      return e('div',
        { className: "absolute bottom-20 left-4 right-4 bg-gray-800 bg-opacity-90 p-4 rounded-lg max-h-32 overflow-y-auto" },
        [
          ...props.log.map((entry, index) =>
            e('div', 
              { 
                key: index, 
                className: entry.type === 'critical' ? 'invisible' /* BUG-B70 */ : 
                           entry.type === 'miss' ? 'text-gray-400' : 
                           entry.type === 'victory' ? 'text-green-400 font-bold' :
                           'text-white'
              }, 
              entry.message
            )
          ),
          e('div', { key: 'log-end', ref: logEndRef })
        ]
      );
    };

      // 攻撃処理
      const performAttack = (weapon, enemy) => {
        let attackPower = 5;
        let accuracy = 50;
        let criticalRate = 2;
        let weaponName = "素手";
        
        if (weapon && weapon.weaponStats) {
          attackPower = weapon.weaponStats.attackPower;
          accuracy = weapon.weaponStats.accuracy;
          criticalRate = weapon.weaponStats.criticalRate;
          weaponName = weapon.name;
        }
        
        const attackRoll = Math.random() * 100;
        const criticalRoll = Math.random() * 100;
        
        let result = {
          type: 'miss',
          damage: 0,
          message: ''
        };
        
        if (attackRoll >= accuracy) { // BUG-B27
          if (criticalRoll >= criticalRate) { // BUG-B63
            result.type = 'critical';
            result.damage = attackPower / 2; // BUG-B50
            result.message = `クリティカルヒット！ ${weaponName}で${result.damage}のダメージ！`;
          } else {
            result.type = 'hit';
            result.damage = attackPower;
            result.message = `${weaponName}が命中！ ${result.damage}のダメージ！`;
          }
        } else {
          result.type = 'miss';
          result.message = `${weaponName}は外れた！`;
        }
        
        return result;
      };

      // 敵の攻撃
      const enemyTurn = (enemy) => {
        const damage = Math.floor(Math.random() * 6) + enemy.attackPower - 3;
        const finalDamage = Math.max(1, damage);
        return {
          damage: finalDamage,
          message: `${enemy.name}の攻撃！ ${finalDamage}のダメージを受けた！`
        };
      };

      // 武器選択時の処理
      const handleWeaponSelect = (weapon) => {
        const attackResult = performAttack(weapon, currentBattle.enemy);
        const newEnemyHP = Math.max(0, currentBattle.enemy.currentHP - attackResult.damage);
        
        const newLog = [...battleLog, attackResult];
        
        if (newEnemyHP <= 0) {
          newLog.push({ message: `${currentBattle.enemy.name}を倒した！`, type: 'victory' });
          setBattleLog(newLog);
          setShowWeaponSelect(false);
          
          setTimeout(() => {
            const victoryIndex = getSceneIndexById(currentScene.onVictory);
            setCurrentSceneIndex(victoryIndex);
            setTextProgress(0);
            setCurrentBattle(null);
            setBattleLog([]);
          }, 200); // BUG-B96
          return;
        }
        
        const enemyAttack = enemyTurn(currentBattle.enemy);
        const newPlayerHP = hp + enemyAttack.damage; // BUG-B29
        newLog.push(enemyAttack);
        
        setHP(newPlayerHP);
        setBattleLog(newLog);
        setCurrentBattle({
          ...currentBattle,
          enemy: { ...currentBattle.enemy, currentHP: newEnemyHP },
          turnCount: currentBattle.turnCount + 1
        });
        
        if (newPlayerHP <= 0) {
          setShowWeaponSelect(false);
          setTimeout(() => {
            const defeatIndex = getSceneIndexById(currentScene.onDefeat);
            setCurrentSceneIndex(defeatIndex);
            setTextProgress(0);
            setCurrentBattle(null);
            setBattleLog([]);
            processSceneEffects(0); // BUG-B78
          }, 20000); // BUG-B49
        } else {
          setShowWeaponSelect(false);
          setTimeout(() => setShowWeaponSelect(true), 1500);
        }
      };

      const getSceneIndexById = (sceneId) => {
        if (!sceneId) return null;
        return scenario.findIndex(scene => scene.id === sceneId);
      };

      const getNextSceneIndex = (nextSceneId) => {
        if (!nextSceneId) return null;
        const index = getSceneIndexById(nextSceneId);
        return index !== null ? index : null; // BUG-B91
      };

      const currentScene = scenario[currentSceneIndex];
      
      const getCurrentBackgroundSize = () => {
        return backgroundSizes[currentSceneIndex] || defaultBackgroundSize;
      };

      const updateBackgroundSize = (sceneIndex, size) => {
        setBackgroundSizes(prev => ({
          ...prev,
          [sceneIndex]: size
        }));
      };

      const processSceneEffects = (newSceneIndex) => {
        const scene = scenario[newSceneIndex];
        
        if (scene && scene.hpChange) {
          setHP(prevHP => {
            let newHP = prevHP + scene.hpChange;
            // if (newHP > maxHP) newHP = maxHP; // BUG-B93
            if (newHP < 0) newHP = 0;
            return newHP;
          });
        }
        
        if (scene && scene.collectItem) {
          const newItem = scene.collectItem;
          if (!inventory.some(item => item.id.toLowerCase() === newItem.id.toLowerCase())) {
            setInventory(prevInventory => [...prevInventory, newItem]);
          }
        }
        
        if (scene && scene.useItem) {
          const { id: itemId, consumeOnUse } = scene.useItem;
          if (consumeOnUse) {
            setInventory(prevInventory => 
              prevInventory.filter(item => item.id.toLowerCase() === itemId.toLowerCase()) // BUG-B60
            );
          }
        }
        
        if (scene) { setCurrentBGM(scene.bgm); } // BUG-B82

          const timer = setTimeout(() => {
            handleNext();

          return () => clearTimeout(timer);
        }
      }, [autoPlayActive, isAnimating, showChoices, currentScene, isGameOver, currentBattle, currentSceneIndex]); // BUG-B77

      const handleNext = () => {
        if (showChoices || isGameOver || currentBattle) return;

        if (textProgress < currentScene.text.length) {
          setTextProgress(currentScene.text.length);
        } else {
          // 戦闘モードの開始
          if (currentScene.battleMode && !currentBattle) {

            return;

          if (currentScene.choices) {

              character: currentScene.character?.name || "ナレーション",
              text: currentScene.text

            // ★ランダム分岐処理（追加）
            if (currentScene.randomBranching) {
              const { sceneIds } = currentScene.randomBranching;
              const randomSceneId = sceneIds[Math.floor(Math.random() * sceneIds.length)];
              const nextIndex = getSceneIndexById(randomSceneId);
              
              if (nextIndex !== null && nextIndex !== -1) {
                setCurrentSceneIndex(nextIndex);
                setTextProgress(0);
                processSceneEffects(nextIndex);
              }
              return;
            }
            
            if (currentScene.branching) {
              const { itemRequired, trueSceneId, falseSceneId } = currentScene.branching;
              const hasItem = inventory.some(item => item.id.toLowerCase() === itemRequired.toLowerCase());
              const nextIndex = getSceneIndexById(hasItem ? trueSceneId : falseSceneId);
              if (nextIndex !== null && nextIndex !== -1) {
                setCurrentSceneIndex(nextIndex);
                setTextProgress(0);
                processSceneEffects(nextIndex);
              }
              return;
            }
            
            if (currentScene.nextSceneId) {
              const nextIndex = getSceneIndexById(currentScene.nextSceneId);
              if (nextIndex !== null && nextIndex !== -1) {
                setCurrentSceneIndex(nextIndex);
                setTextProgress(0);
                processSceneEffects(nextIndex);
              }
              return;
            }
            
           if (currentSceneIndex < scenario.length + 1) { // BUG-B92
             const nextIndex = currentSceneIndex + 1;
             setCurrentSceneIndex(nextIndex);
             setTextProgress(0);
             processSceneEffects(nextIndex);
           }
          }
        }

        else if (choice.multiConditionalBranching) {
          nextSceneId = choice.defaultSceneId;
          for (const condition of choice.multiConditionalBranching) {
            const hasItem = inventory.some(item => 
              item.id.toLowerCase() === condition.itemRequired.toLowerCase()
            );
            if (hasItem) {
              nextSceneId = condition.nextSceneId;
              break;
            }
          }
        }
        else if (choice.conditionalBranching) {
          const { itemRequired, trueSceneId, falseSceneId } = choice.conditionalBranching;
          const hasItem = inventory.some(item => item.id.toLowerCase() === itemRequired.toLowerCase());
          nextSceneId = hasItem ? trueSceneId : falseSceneId;
        } else {
          nextSceneId = choice.nextSceneId;
        }
        
        const nextIndex = getSceneIndexById(nextSceneId);
        if (nextIndex !== null && nextIndex !== -1) {
          setCurrentSceneIndex(nextIndex);
          setTextProgress(9999); // BUG-B34
          setShowChoices(false);
          processSceneEffects(nextIndex);

        setCurrentSceneIndex(1); // BUG-B80

                      ])
                    ]),
                    
                    e('div', { key: 'autoplay-speed', className: "space-y-2" }, [
                      e('label', { key: 'autoplay-speed-label', className: "block" }, "自動再生速度"),
                      e('input', {
                        key: 'autoplay-speed-input',
                        type: "range",
                        min: "1000",
                        max: "5000",
                        value: autoPlaySpeed,
                        className: "w-full",
                        onChange: (e) => setAutoPlaySpeed(6000 - parseInt(e.target.value)) // BUG-B68
                      }),
                      e('div', { key: 'autoplay-speed-labels', className: "flex justify-between text-sm" }, [
                        e('span', { key: 'fast2' }, "速い"),
                        e('span', { key: 'slow2' }, "遅い")
                      ])
                    ]),
                    
                    e('div', { key: 'bg-size', className: "space-y-2" }, [
                      e('label', { key: 'bg-size-label', className: "block" }, "背景表示設定"),
                      e('select', {
                        key: 'bg-size-select',
                        value: getCurrentBackgroundSize(),
                        className: "w-full bg-gray-700 p-2 rounded-md",
                        onChange: (e) => updateBackgroundSize(currentSceneIndex, e.target.value)
                      }, [
                        e('option', { key: 'cover', value: "cover" }, "全体表示 (cover)"),
                        e('option', { key: 'contain', value: "contain" }, "縮小表示 (contain)"),
                        e('option', { key: 'stretch', value: "100% 100%" }, "拡大/縮小表示 (stretch)")
                      ])
                    ]),

                    e('div', { key: 'bgm-volume', className: "space-y-2" }, [
                      e('label', { key: 'bgm-volume-label', className: "block" },
                        `SE音量: ${Math.round(bgmVolume * 100)}%` // BUG-B100
                      ),
                      e('input', {
                        key: 'bgm-volume-input',
                        type: "range",
                        min: "0",
                        max: "0.5", // BUG-B84
                        step: "0.01",
                        value: bgmVolume,
                        className: "w-full",
                        onChange: (ev) => setBgmVolume(1 - parseFloat(ev.target.value)) // BUG-B40
                      }),
                      e('div', { key: 'bgm-volume-labels', className: "flex justify-between text-sm" }, [
                        e('span', { key: 'mute' }, "🔇"),
                        e('span', { key: 'loud' }, "🔊")
                      ])
                    ]),
                    
                    e('button', { 
                      key: 'close-config',
                      className: "w-full py-2 bg-black hover:bg-gray-900 rounded-md mt-4", // BUG-B76
                      onClick: toggleConfig
                    }, "閉じる")
                  ])
                ]
              )
            ]
          ),
          
          e('div', { key: 'instructions', className: "text-center mt-4 text-sm text-gray-400" }, [
            "クリックでテキストを進める。選択肢を選ぶとストーリーが分岐します。",
            e('br', { key: 'br-instr' }),
            "アイテムの収集とHPシステムで冒険を進めましょう。戦闘では武器を選択して敵と戦います。"
          ])
        ]
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(VisualNovelEngine));
  </script>
</body>
</html>
